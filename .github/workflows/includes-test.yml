name: Validar projeto

on:
  workflow_call:
    inputs:
      environment:
        description: 'Nome do ambiente'
        required: true
        type: string
      python_version:
        description: 'Versão do Python'
        required: false
        type: string
        default: '3.12'
      node_version:
        description: 'Versão do Node.js'
        required: false
        type: string
        default: '20'

jobs:
  validate:
    name: Validar backend e frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # O pyodbc precisa da libodbc para ser importado (o driver real só existe na imagem).
      - name: Instalar unixODBC
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc

      - name: Instalar dependências do backend
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar backend
        working-directory: backend
        shell: bash
        run: |
          python -m compileall -q app
          python -c "from app.main import app; print(app.title)"
          python -m pytest -q

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build do frontend
        working-directory: frontend
        shell: bash
        run: npm run build

      - name: Resumo da validação
        shell: bash
        run: |
          {
            echo '## Validação concluída'
            echo ''
            echo "- Ambiente: ${{ inputs.environment }}"
            echo '- Backend: compile, import e pytest ok'
            echo '- Frontend: build ok'
          } >> "$GITHUB_STEP_SUMMARY"
