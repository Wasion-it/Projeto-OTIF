# CI inicial do OTIF: testes do backend, build do frontend e validacao dos
# builds Docker. Nao publica imagens em registry e nao faz deploy.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar unixODBC (necessario para importar pyodbc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

  docker:
    name: Docker (validacao de build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: otif-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=otif-backend
          cache-to: type=gha,mode=max,scope=otif-backend

      - name: Build frontend (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: otif-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=otif-frontend
          cache-to: type=gha,mode=max,scope=otif-frontend
