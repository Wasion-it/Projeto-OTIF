name: Build de imagens Docker

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag imutável usada nas imagens'
        required: true
        type: string
      push:
        description: 'Publicar imagens no Registry Wasion'
        required: false
        type: boolean
        default: false
      runner_label:
        description: 'Runner usado para construir as imagens'
        required: false
        type: string
        default: 'ubuntu-latest'

    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

env:
  BACKEND_IMAGE: registry.wasion.com.br/wasion/otif-backend
  FRONTEND_IMAGE: registry.wasion.com.br/wasion/otif-frontend

jobs:
  build:
    name: Construir e validar imagens backend e frontend
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 50

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Registry Wasion
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: registry.wasion.com.br
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build do backend
        shell: bash
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "${BACKEND_IMAGE}:${{ inputs.image_tag }}" \
            backend

      # VITE_API_URL vazio: o SPA chama a mesma origem e o Nginx faz proxy da API.
      - name: Build do frontend
        shell: bash
        run: |
          docker build \
            --build-arg VITE_API_URL= \
            -f frontend/Dockerfile \
            -t "${FRONTEND_IMAGE}:${{ inputs.image_tag }}" \
            frontend

      - name: Trivy - imagem backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: registry.wasion.com.br/wasion/otif-backend:${{ inputs.image_tag }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy - imagem frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: registry.wasion.com.br/wasion/otif-frontend:${{ inputs.image_tag }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Publicar imagens imutáveis
        if: ${{ inputs.push }}
        shell: bash
        run: |
          docker push "${BACKEND_IMAGE}:${{ inputs.image_tag }}"
          docker push "${FRONTEND_IMAGE}:${{ inputs.image_tag }}"

      - name: Resumo das imagens
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Imagens Docker'
            echo ''
            echo "- Backend: ${BACKEND_IMAGE}:${{ inputs.image_tag }}"
            echo "- Frontend: ${FRONTEND_IMAGE}:${{ inputs.image_tag }}"
            echo '- Segurança: Trivy bloqueia vulnerabilidades CRITICAL com correção disponível'
            echo "- Publicadas no Registry Wasion: ${{ inputs.push }}"
            echo "- Runner: ${{ inputs.runner_label }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout do Registry Wasion
        if: ${{ always() && inputs.push }}
        shell: bash
        run: docker logout registry.wasion.com.br || true
