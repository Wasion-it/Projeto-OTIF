# Template de server do Nginx para o frontend OTIF.
# Copiado para /etc/nginx/templates/default.conf.template; o entrypoint oficial
# do Nginx aplica envsubst (somente variaveis definidas, ex.: ${BACKEND_UPSTREAM})
# e grava o resultado em /etc/nginx/conf.d/default.conf.
#
# BACKEND_UPSTREAM: origem do backend, SEM barra/caminho no final
#   (padrao: http://otif-backend:8000).
# NGINX_RESOLVER: DNS usado para resolver o backend em runtime
#   (padrao: 127.0.0.11, DNS embutido do Docker/Swarm).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: o SPA chama a mesma origem (VITE_API_URL vazio no build) e o Nginx
    # repassa as rotas do FastAPI, que ficam na raiz (sem prefixo /api).
    # O SPA usa hash routing (/#...), entao nao ha conflito com estes caminhos.
    #
    # proxy_pass via variavel + resolver: o hostname do backend e resolvido
    # novamente a cada `valid`, entao recriar so o otif-backend (IP novo) nao
    # deixa o proxy preso ao IP antigo. Sem URI na variavel, o caminho original
    # da requisicao e repassado sem alteracao.
    # ATENCAO: a lista precisa conter TODOS os prefixos de rota do backend
    # (backend/app/main.py e backend/app/routers/*). Prefixo ausente aqui cai no
    # fallback do SPA e a API devolve index.html em vez de JSON.
    location ~ ^/(health|metrics|pedidos|comercial|config|confirmacoes|etapas)(/|$) {
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        resolver_timeout 5s;
        set $otif_backend ${BACKEND_UPSTREAM};
        proxy_pass $otif_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Assets com hash no nome (gerados pelo Vite): cache longo e imutavel.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # index.html nunca deve ficar em cache (aponta para os assets da versao atual).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
